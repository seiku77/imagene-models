name: Convert models

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'モデルID(JSON配列)'
        default: '["sd15","dreamshaper8","realistic-vision-51","anything-v5"]'
  push:
    branches: ['ccr-*']
    paths: ['.github/workflows/convert.yml', 'scripts/**']

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ${{ fromJSON(github.event.inputs.models || '["sd15"]') }}
    env:
      ID: ${{ matrix.model }}
      TAG: ${{ matrix.model }}-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install huggingface_hub safetensors typing_extensions numpy Pillow requests pytorch_lightning absl-py

      - name: Get MediaPipe converter
        run: |
          # 変換スクリプトは現在のリポジトリから削除されているため、過去のコミットから取り出す
          find_hist() {
            git -C "$1" log --all --diff-filter=AM --format='C %H' --name-only -- '*convert.py' \
              | awk '/^C /{c=$2; next} NF && tolower($0) ~ /image_?gen/ {print c, $0; exit}'
          }
          FOUND=""
          for REPO in mediapipe-samples mediapipe; do
            git clone -q --filter=blob:none --no-checkout "https://github.com/google-ai-edge/$REPO" "src-$REPO"
            FOUND=$(find_hist "src-$REPO")
            if [ -n "$FOUND" ]; then DIR="src-$REPO"; break; fi
          done
          if [ -z "$FOUND" ]; then echo "converter not found in history"; exit 1; fi
          COMMIT=${FOUND%% *}
          FILE=${FOUND#* }
          git -C "$DIR" checkout "$COMMIT" -- "$(dirname "$FILE")"
          CONVERTER=$(realpath "$DIR/$FILE")
          echo "CONVERTER=$CONVERTER" >> "$GITHUB_ENV"
          echo "CONVERTER_REF=google-ai-edge/${DIR#src-}@$COMMIT:$FILE" >> "$GITHUB_ENV"
          echo "converter: $CONVERTER ($COMMIT)"
          ls "$(dirname "$CONVERTER")"
          if [ -f "$(dirname "$CONVERTER")/requirements.txt" ]; then
            cat "$(dirname "$CONVERTER")/requirements.txt"
            grep -v -i -E '^torch([=<> ]|$)' "$(dirname "$CONVERTER")/requirements.txt" > /tmp/req.txt || true
            pip install -r /tmp/req.txt || true
          fi

      - name: Fetch checkpoint
        run: |
          python scripts/fetch_ckpt.py "$ID" "$RUNNER_TEMP/model.ckpt"
          rm -rf ~/.cache/huggingface
          df -h /

      - name: Convert
        run: |
          cd "$(dirname "$CONVERTER")"
          python "$CONVERTER" --ckpt_path "$RUNNER_TEMP/model.ckpt" --output_path "$RUNNER_TEMP/out/$ID"
          rm -f "$RUNNER_TEMP/model.ckpt"
          ls "$RUNNER_TEMP/out/$ID" | wc -l
          du -sh "$RUNNER_TEMP/out/$ID"

      - name: Package
        run: |
          mkdir -p dist
          curl -fsSL https://raw.githubusercontent.com/CompVis/stable-diffusion/main/LICENSE -o "$RUNNER_TEMP/out/$ID/LICENSE-CreativeML-OpenRAIL-M.txt"
          cp "$RUNNER_TEMP/out/$ID/LICENSE-CreativeML-OpenRAIL-M.txt" dist/
          (cd "$RUNNER_TEMP/out" && zip -q -1 -r "$GITHUB_WORKSPACE/dist/$ID.zip" "$ID")
          rm -rf "$RUNNER_TEMP/out"
          cd dist
          SIZE=$(stat -c %s "$ID.zip")
          SHA=$(sha256sum "$ID.zip" | cut -d' ' -f1)
          if [ "$SIZE" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "$ID.zip" "$ID.zip.part"
            rm "$ID.zip"
          fi
          python - "$ID" "$SIZE" "$SHA" "$TAG" "${{ github.repository }}" "$RUNNER_TEMP/model.ckpt.source.json" <<'PY'
          import json, os, sys
          mid, size, sha, tag, repo, src = sys.argv[1:]
          files = sorted(f for f in os.listdir(".") if f.startswith(mid + ".zip"))
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          json.dump({"id": mid, "sizeBytes": int(size), "sha256": sha,
                     "urls": [base + f for f in files], "source": json.load(open(src))},
                    open(f"{mid}.manifest.json", "w"), indent=2)
          print(open(f"{mid}.manifest.json").read())
          PY
          ls -la

      - name: Release
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" dist/* --title "$TAG" \
            --notes "MediaPipe Image Generator用に変換したモデル。ライセンス: CreativeML OpenRAIL-M(同梱のLICENSEを参照)。元モデル: $(cat $RUNNER_TEMP/model.ckpt.source.json) / 変換スクリプト: $CONVERTER_REF"
